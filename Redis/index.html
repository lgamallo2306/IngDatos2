<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prototipo Red Social - Test Redis</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800 p-8">

    <div class="max-w-4xl mx-auto space-y-6">
        
        <header class="bg-white p-6 rounded-lg shadow text-center">
            <h1 class="text-2xl font-bold text-blue-600">Testing Backend: Sesiones y Métricas con Redis</h1>
            <p class="text-sm text-gray-500 mt-2">Estado del Token Local: <span id="tokenStatus" class="font-bold text-red-500">Ninguno</span></p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            
            <div class="space-y-6">
                
                <div class="bg-white p-6 rounded-lg shadow space-y-4">
                    <h2 class="text-xl font-semibold border-b pb-2 text-gray-700">Acciones de Usuario</h2>
                    
                    <div class="bg-gray-50 p-4 rounded border border-gray-200 space-y-3">
                        <div>
                            <label class="block text-xs font-bold text-gray-700 mb-1">User ID</label>
                            <input type="text" id="userIdInput" value="d8defe1e-bd72-5b36-b97c-aadc2cdcf4f1" class="w-full px-3 py-2 border rounded text-sm focus:outline-none focus:border-blue-500">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-700 mb-1">Username</label>
                            <input type="text" id="usernameInput" value="luca_gonzalez940" class="w-full px-3 py-2 border rounded text-sm focus:outline-none focus:border-blue-500">
                        </div>
                        <button onclick="iniciarSesion()" class="w-full bg-blue-500 hover:bg-blue-600 text-white py-2 px-4 rounded transition font-medium">
                            1. Simular Login (Crear Sesión)
                        </button>
                    </div>
                    
                    <button onclick="verFeed()" class="w-full bg-green-500 hover:bg-green-600 text-white py-2 px-4 rounded transition font-medium">
                        2. Ver Feed (Requiere Token)
                    </button>
                    
                    <button onclick="cerrarSesion()" class="w-full bg-red-500 hover:bg-red-600 text-white py-2 px-4 rounded transition font-medium">
                        3. Cerrar Sesión (Destruir Token)
                    </button>
                </div>

                <div class="bg-white p-6 rounded-lg shadow space-y-4 border-t-4 border-purple-500">
                    <h2 class="text-xl font-semibold border-b pb-2 text-purple-700">Panel de Administración</h2>
                    
                    <button onclick="verUsuariosOnline()" class="w-full bg-purple-600 hover:bg-purple-700 text-white py-2 px-4 rounded transition font-medium">
                        📊 Consultar Usuarios Online (Últimos 5 min)
                    </button>
                    
                    <div class="bg-purple-50 p-4 rounded border border-purple-200 space-y-3">
                        <div>
                            <label class="block text-xs font-bold text-purple-800 mb-1">IP a Banear</label>
                            <input type="text" id="ipBanInput" value="127.0.0.1" class="w-full px-3 py-2 border border-purple-300 rounded text-sm focus:outline-none focus:border-purple-500">
                        </div>
                        <button onclick="banearIP()" class="w-full bg-red-600 hover:bg-red-700 text-white py-2 px-4 rounded transition font-medium">
                            🚫 Aplicar Baneo de IP (24hs)
                        </button>
                    </div>
                </div>
            </div>

            <div class="bg-gray-800 p-6 rounded-lg shadow text-green-400 font-mono text-sm flex flex-col h-[530px]">
                <h2 class="text-gray-400 border-b border-gray-600 pb-2 mb-4">Consola de Respuestas de la API</h2>
                <pre id="consola" class="flex-1 overflow-auto whitespace-pre-wrap">Esperando acciones...</pre>
            </div>
            
        </div>
    </div>

    <script>
        // Configurado en puerto 5000 para evitar bloqueos del navegador
        const API_URL = 'http://127.0.0.1:5000/api';
        const consola = document.getElementById('consola');
        const tokenStatus = document.getElementById('tokenStatus');

        function logMensaje(obj) {
            consola.textContent = JSON.stringify(obj, null, 2);
        }

        function actualizarEstadoToken() {
            const token = localStorage.getItem('mi_token_social');
            if (token) {
                tokenStatus.textContent = "Guardado (" + token.substring(0,8) + "...)";
                tokenStatus.className = "font-bold text-green-500";
            } else {
                tokenStatus.textContent = "Ninguno";
                tokenStatus.className = "font-bold text-red-500";
            }
        }

        // 1. Iniciar Sesión
        async function iniciarSesion() {
            const userIdValue = document.getElementById('userIdInput').value;
            const usernameValue = document.getElementById('usernameInput').value;

            try {
                const response = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        user_id: userIdValue,
                        username: usernameValue
                    })
                });
                const data = await response.json();
                
                if (response.ok && data.token) {
                    localStorage.setItem('mi_token_social', data.token);
                    actualizarEstadoToken();
                }
                logMensaje(data);
            } catch (error) {
                logMensaje({ error: error.message });
            }
        }

        // 2. Ver Feed (Petición Autenticada)
        async function verFeed() {
            const token = localStorage.getItem('mi_token_social');
            
            try {
                const response = await fetch(`${API_URL}/feed`, {
                    method: 'GET',
                    headers: { 
                        'Authorization': `Bearer ${token}` 
                    }
                });
                const data = await response.json();
                logMensaje(data);
            } catch (error) {
                logMensaje({ error: error.message });
            }
        }

        // 3. Cerrar Sesión
        async function cerrarSesion() {
            const token = localStorage.getItem('mi_token_social');
            
            try {
                const response = await fetch(`${API_URL}/logout`, {
                    method: 'POST',
                    headers: { 
                        'Authorization': `Bearer ${token}` 
                    }
                });
                const data = await response.json();
                
                localStorage.removeItem('mi_token_social');
                actualizarEstadoToken();
                logMensaje(data);
            } catch (error) {
                logMensaje({ error: error.message });
            }
        }

        // ==========================================
        // NUEVAS FUNCIONES DE ADMINISTRACIÓN
        // ==========================================

        // 4. Consultar cantidad de usuarios online
        async function verUsuariosOnline() {
            try {
                const response = await fetch(`${API_URL}/admin/online`, {
                    method: 'GET'
                });
                const data = await response.json();
                logMensaje(data);
            } catch (error) {
                logMensaje({ error: error.message });
            }
        }

        // 5. Enviar IP para aplicar baneo
        async function banearIP() {
            const ipValue = document.getElementById('ipBanInput').value;
            
            try {
                const response = await fetch(`${API_URL}/admin/ban`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ip_address: ipValue })
                });
                const data = await response.json();
                logMensaje(data);
            } catch (error) {
                logMensaje({ error: error.message });
            }
        }

        // Iniciar el estado visual al cargar la página
        actualizarEstadoToken();
    </script>
</body>
</html>
